name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract iOS Project if Zipped
        run: |
          if [ -f ESP32LED_iOS_Project.zip ]; then
            unzip -o ESP32LED_iOS_Project.zip
          fi

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project ios_app/ESP32LED.xcodeproj \
            -scheme ESP32LED \
            -configuration Release \
            -archivePath build/ESP32LED.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ESP32LED.xcarchive/Products/Applications/ESP32LED.app build/Payload/
          cd build
          zip -r ESP32LED.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32LED-iOS-IPA
          path: build/ESP32LED.ipa
